<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <style>
        body {
            padding: 20px;
            font-family: sans-serif;
            min-width: 400px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }

        input[type="text"],
        input[type="password"],
        select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }

        button {
            padding: 10px 20px;
            background: #007aff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            background: #0056b3;
        }

        #status {
            margin-left: 10px;
            font-weight: bold;
            display: none;
        }

        hr {
            border: none;
            border-top: 1px solid #ccc;
            margin: 20px 0;
        }

        .note {
            font-size: 0.85em;
            color: #666;
            margin-top: 4px;
        }
    </style>
</head>

<body>
    <h2>Lyrics Translator Settings</h2>

    <div class="form-group">
        <label>AI Provider</label>
        <select id="provider">
            <option value="Gemini">Google Gemini</option>
            <option value="DeepSeek">DeepSeek</option>
            <option value="OpenAI">OpenAI</option>
            <option value="HuggingFace">Hugging Face</option>
            <option value="OpenRouter">OpenRouter</option>
        </select>
    </div>

    <div class="form-group">
        <label>Gemini API Key</label>
        <input type="password" id="gemini_key" placeholder="Enter Gemini Key">
    </div>

    <div class="form-group" id="gemini_model_group">
        <label>Gemini Model Name (Optional)</label>
        <input type="text" id="gemini_model" placeholder="e.g. results from python script">
        <div class="note">Leave empty to use auto-discovery (gemini-2.5-flash)</div>
    </div>

    <div class="form-group">
        <label>DeepSeek API Key</label>
        <input type="password" id="deepseek_key" placeholder="Enter DeepSeek Key">
    </div>

    <div class="form-group">
        <label>OpenAI API Key</label>
        <input type="password" id="openai_key" placeholder="Enter OpenAI Key">
    </div>
    <div class="form-group">
        <label>OpenAI Model (Optional)</label>
        <input type="text" id="openai_model" placeholder="Default: gpt-3.5-turbo">
    </div>

    <div class="form-group">
        <label>Hugging Face Access Token</label>
        <input type="password" id="hf_token" placeholder="Enter Hugging Face Token">
    </div>
    <div class="form-group">
        <label>Hugging Face Model ID (Optional)</label>
        <input type="text" id="hf_model" placeholder="Default: mistralai/Mistral-7B-Instruct-v0.3">
    </div>

    <div class="form-group">
        <label>OpenRouter API Key</label>
        <input type="password" id="openrouter_key" placeholder="Enter OpenRouter Key">
    </div>
    <div class="form-group">
        <label>OpenRouter Model (Optional)</label>
        <input type="text" id="openrouter_model" placeholder="Default: anthropic/claude-3-haiku">
    </div>

    <hr>

    <div class="form-group">
        <label>Genius Access Token</label>
        <input type="password" id="genius_token" placeholder="Enter Genius Client API Token">
        <div class="note">Required for fetching lyrics.</div>
    </div>

    <button id="save">Save Settings</button>
    <span id="status"></span>

    <script src="options.js"></script>
</body>

</html>
