<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body {
            width: 300px;
            padding: 15px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f5f7;
            color: #333;
        }
        h2 {
            margin-top: 0;
            font-size: 16px;
            text-align: center;
            color: #555;
        }
        .form-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 12px;
            font-weight: bold;
        }
        input[type="text"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007aff;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
        #status {
            margin-top: 10px;
            font-size: 12px;
            text-align: center;
            color: #666;
            min-height: 1.2em;
        }
    </style>
</head>
<body>
    <h2>Lyrics Search</h2>

    <div class="form-group">
        <label>Free Search (Query)</label>
        <input type="text" id="query" placeholder="e.g. Shape of You">
    </div>

    <div class="form-group">
        <label>Artist</label>
        <input type="text" id="artist" placeholder="Artist Name">
    </div>

    <div class="form-group">
        <label>Song</label>
        <input type="text" id="song" placeholder="Song Title">
    </div>

    <button id="btnSearch">Search & Show Overlay</button>
    <div id="status">Ready</div>

    <script src="popup.js"></script>
</body>
</html>
